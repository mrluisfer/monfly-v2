<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			document.documentElement.classList.add('js');
			// iOS Safari applies :active on touch only once some touchstart listener exists (.press).
			document.addEventListener('touchstart', function () {}, { passive: true });
			// The viewer's time zone, so the server draws months where they live (TIME_ZONE_COOKIE).
			try {
				document.cookie =
					'tz=' +
					encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone) +
					'; path=/; max-age=31536000; samesite=lax';
			} catch {}
		</script>
		<!-- Static, not in a Svelte <head>: they stay even if a page fails to hydrate.
		     The .ico covers browsers that skip SVG icons (and anyone asking for /favicon.ico). -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Makes the app installable. `theme-color` is not set here: ModeWatcher in
		     the root layout writes it, and follows the theme as it changes. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
