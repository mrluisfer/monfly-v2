<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · Monfly</title>
		<!--
			The last resort, shown only when the error page itself can't be drawn: an
			error thrown in `handle` (hooks.server.ts), or while rendering
			+error.svelte. None of the app is here — no Svelte, no app.css, no fonts —
			so whatever this page becomes is written in this file. The background is
			the light canvas, the app's default theme.
		-->
		<style>
			body {
				margin: 0;
				min-height: 100dvh;
				background: #f2f2f4;
			}
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
				border-width: 0;
			}
		</style>
	</head>
	<body>
		<h1 class="sr-only">%sveltekit.status% · %sveltekit.error.message%</h1>
	</body>
</html>
