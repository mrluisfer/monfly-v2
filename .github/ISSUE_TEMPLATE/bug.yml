name: Bug
description: Something broke or looks wrong.
labels: ['type: bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what you expected instead. Paste or drag in a screenshot if it helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open …
        2. Click …
