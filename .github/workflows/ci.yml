name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build imports $lib/server/db, which throws without a URL. neon()
      # only parses it — nothing connects — so the shared, live database
      # never has to reach CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CLAUDE.md's bar: 0 errors and 0 warnings.
      - run: pnpm check --fail-on-warnings
      - run: pnpm build
