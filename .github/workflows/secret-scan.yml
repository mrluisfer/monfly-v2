# Escaneo de secretos con gitleaks.
# Sustituye a GitHub Secret Scanning + push protection, que en repo privado
# de cuenta personal requiere GitHub Advanced Security (de paga).
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilegio posible: solo lectura. pull-requests: read es para que
# gitleaks liste los commits del PR (en repo privado, sin el falla con 403).
permissions:
  contents: read
  pull-requests: read

# Un push nuevo sobre la misma rama cancela el run anterior.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: sin esto gitleaks solo ve el ultimo commit
          # y un secreto introducido 3 commits atras en el mismo PR se cuela.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin artifact SARIF ni comentarios en el PR: el resumen del job ya
          # lista los hallazgos (redactados); el job falla y con eso basta.
          # Comentar en el PR pediria pull-requests: write.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
